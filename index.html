const norm = s => String(s).normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
let singer = '';
const count = {}; DATA.forEach(r => { const k = (r.s || '歌手还没记上').split(' / ')[0]; count[k] = (count[k] || 0) + 1; });
const singersTop = Object.entries(count).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]);
document.getElementById('singers').innerHTML = '<button class="chip on" data-s="">全部</button>' + singersTop.map(([k, n]) => '<button class="chip" data-s="' + k + '">' + k + ' ' + n + '</button>').join('');
document.getElementById('singers').onclick = e => { const b = e.target.closest('button'); if (!b) return; singer = b.dataset.s; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); draw(); };
const day = t => new Date(t * 1000).toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' });
function draw() {
  const q = norm(document.getElementById('q').value), by = document.getElementById('sort').value;
  let list = DATA.filter(r => (!q || norm(r.n + r.s + r.x).includes(q)) && (!singer || (r.s || '').startsWith(singer)));
  list.sort((a, b) => by === 'p' ? b.p - a.p : by === 'n' ? a.n.localeCompare(b.n, 'zh-CN') : b.d - a.d);
  document.getElementById('count').textContent = DATA.length;
  const e = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  document.getElementById('list').innerHTML = list.map(r => '<a class="card" target="_blank" href="https://www.bilibili.com/video/' + r.b + '"><img loading="lazy" src="' + r.c + '@480w_270h_1c.jpg" alt=""><div class="info"><div class="t">《' + e(r.n) + '》</div>' + (r.x ? '<div class="x">' + e(r.x) + '</div>' : '') + '<div class="m">' + e(r.s || '歌手还没记上') + ' · ' + day(r.d) + ' · ' + e(r.l) + ' · ▶ ' + r.p + '</div></div></a>').join('') || '<div class="empty">没找到，换个词试试</div>';
}
document.getElementById('q').oninput = draw; document.getElementById('sort').onchange = draw; draw();
